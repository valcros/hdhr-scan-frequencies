  schedule: "0 2 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    metadata:
      labels:
        app: hdhr-scanner
        version: "3.0"
        schedule: weekly
    spec:
      backoffLimit: 2
